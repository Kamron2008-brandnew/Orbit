name: Scanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set your team ID to run on device
targets:
  Scanner:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Scanner
        NSCameraUsageDescription: The camera is used to scan the shape of real objects and rooms.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scanner
        TARGETED_DEVICE_FAMILY: "1,2"
